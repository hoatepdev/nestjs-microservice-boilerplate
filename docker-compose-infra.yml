version: '3'

services:
  mongo:
    container_name: nestjs-microservice-mongo
    image: mongo:4.2.20
    volumes:
      - mongo-data:/data/db
    ports:
      - '27017:27017'
    networks:
      - mongo-network
    restart: always
    environment:
      MONGO_INITDB_DATABASE: nestjs-microservice

  postgres:
    container_name: nestjs-microservice-postgres
    image: postgres
    env_file:
      - .env
    ports:
      - '9800:5432'
    volumes:
      - nestjs-microservice-postgres:/data/postgres
      - .docker/postgres/create-database.sql:/docker-entrypoint-initdb.d/create-database.sql
    restart: always
    networks:
      - postgres-network

  redis:
    container_name: nestjs-microservice-redis
    image: 'redis:alpine'
    volumes:
      - nestjs-microservice-redis:/data
    ports:
      - 9830:6379
    restart: always

  zipkin-all-in-one:
    container_name: nestjs-microservice-zipkin-all-in-one
    image: openzipkin/zipkin:latest
    networks:
      - collector-network
    ports:
      - '9610:9411'
    env_file:
      - .env

  prometheus:
    container_name: nestjs-microservice-prometheus
    image: prom/prometheus:v2.47.0
    networks:
      - collector-network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--enable-feature=otlp-write-receiver'
      - '--enable-feature=exemplar-storage'
    env_file:
      - .env
    ports:
      - '9620:9090'
    volumes:
      - .docker/prometheus/config.yml:/etc/prometheus/prometheus.yml
      - .docker/prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml

  collector:
    container_name: nestjs-microservice-collector
    image: otel/opentelemetry-collector-contrib:latest
    command: ['--config=/conf/collector-config.yaml']
    networks:
      - collector-network
    volumes:
      - .docker/collector/collector-config.yaml:/conf/collector-config.yaml
    env_file:
      - .env
    ports:
      - '9464:9464'
      - '4317:4317'
      - '4318:4318'
    depends_on:
      - zipkin-all-in-one

  app-alertmanager:
    image: prom/alertmanager
    networks:
      - collector-network
    env_file:
      - .env
    ports:
      - '9093:9093'
    volumes:
      - .docker/prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml

  mongo-express:
    container_name: nestjs-microservice-mongo-express
    image: mongo-express:0.49.0
    depends_on:
      - mongo
    restart: always
    ports:
      - 9820:8081
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_MONGODB_ENABLE_ADMIN: 'true'
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: pass
    networks:
      - mongo-network

  pgadmin:
    container_name: nestjs-microservice-pgadmin
    image: dpage/pgadmin4
    env_file:
      - .env
    ports:
      - '9810:80'
    depends_on:
      - postgres
    networks:
      - postgres-network

  grafana:
    container_name: nestjs-microservice-grafana
    image: grafana/grafana:latest
    networks:
      - collector-network
      - postgres-network
      - mongo-network
    ports:
      - '9600:3000'
    volumes:
      - grafana-storage:/var/lib/grafana
    env_file:
      - .env
    depends_on:
      - prometheus
    restart: always

  loki:
    image: grafana/loki:2.9.4
    ports:
      - '9630:3100'
    command: -config.file=/etc/loki/local-config.yaml
    env_file:
      - .env
    networks:
      - collector-network
      - postgres-network
      - mongo-network
    depends_on:
      - grafana

  promtail:
    image: grafana/promtail:2.9.4
    networks:
      - collector-network
      - postgres-network
      - mongo-network
    volumes:
      - /var/log:/var/log
      - .docker/grafana/promtail-config.yml:/etc/promtail/promtail.yaml
    command: -config.file=/etc/promtail/promtail.yaml
    depends_on:
      - grafana
    env_file:
      - .env

volumes:
  nestjs-microservice-postgres:
  nestjs-microservice-redis:
  mongo-data:
  grafana-storage:

networks:
  collector-network:
    driver: bridge
  mongo-network:
    driver: bridge
  postgres-network:
    driver: bridge
